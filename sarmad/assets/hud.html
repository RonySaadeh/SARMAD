<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SARMAD</title>
<style>
  :root {
    --cyan: #4ff2ff;
    --cyan-dim: #175055;
    --cyan-soft: #9fe9ee;
    --bg: #050b0d;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: Consolas, "Segoe UI", monospace;
    color: var(--cyan);
    user-select: none;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    padding: 16px 0;
    box-sizing: border-box;
  }
  #core {
    position: relative;
    width: 200px; height: 200px;
    flex-shrink: 0;
  }
  .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid var(--cyan-dim);
    box-shadow: 0 0 12px var(--cyan-dim) inset;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }
  #ring-outer { animation: spin 14s linear infinite; border-style: dashed; }
  #ring-mid { inset: 22px; animation: spin 9s linear infinite reverse; }
  #ring-inner { inset: 48px; }
  #core-glow {
    position: absolute; inset: 72px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--cyan) 0%, var(--cyan-dim) 70%, transparent 100%);
    filter: blur(2px);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.06); }
  }
  #status {
    margin-top: 20px;
    letter-spacing: 4px;
    font-size: 13px;
    text-transform: uppercase;
    text-shadow: 0 0 8px var(--cyan);
    opacity: 0.9;
    flex-shrink: 0;
  }
  #transcript {
    margin-top: 14px;
    width: 270px;
    min-height: 52px;
    font-size: 11px;
    line-height: 1.5;
    text-align: center;
    opacity: 0.85;
    flex-shrink: 0;
  }
  #transcript .you { color: var(--cyan-soft); }
  #transcript .sarmad { color: var(--cyan); }

  /* --- state variants --- */
  body.listening .ring {
    border-color: var(--cyan);
    box-shadow: 0 0 18px var(--cyan) inset;
  }
  body.listening #core-glow { animation-duration: 0.9s; }

  body.thinking #ring-outer { animation-duration: 3s; }
  body.thinking #ring-mid { animation-duration: 2s; }
  body.thinking .ring {
    border-color: var(--cyan-soft);
  }

  body.speaking #core-glow { animation: pulse 0.35s ease-in-out infinite; }
  body.speaking .ring {
    border-color: var(--cyan);
    box-shadow: 0 0 22px var(--cyan) inset;
  }

  body.coding .ring {
    border-color: var(--cyan);
    box-shadow: 0 0 20px var(--cyan) inset;
  }
  body.coding #core-glow { animation-duration: 1.2s; }

  /* --- live activity panel (coding only) --- */
  #log-panel {
    width: 300px;
    max-width: 88%;
    height: 0;
    opacity: 0;
    margin-top: 0;
    overflow: hidden;
    transition: height 0.35s ease, opacity 0.35s ease, margin-top 0.35s ease;
    flex-shrink: 0;
  }
  body.coding #log-panel {
    height: 260px;
    opacity: 1;
    margin-top: 16px;
  }
  #log-header {
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 3px;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--cyan-soft);
    opacity: 0.75;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--cyan-dim);
  }
  #log-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
    animation: blink 1s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  #log-lines {
    height: calc(100% - 22px);
    overflow-y: auto;
    padding: 8px 2px;
    font-size: 10.5px;
    line-height: 1.6;
    text-align: left;
    color: var(--cyan-soft);
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 24px);
    mask-image: linear-gradient(to bottom, transparent, black 24px);
  }
  #log-lines::-webkit-scrollbar { width: 4px; }
  #log-lines::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 2px; }
  #log-lines div {
    white-space: pre-wrap;
    word-break: break-word;
    opacity: 0.9;
    animation: fadeIn 0.25s ease;
  }
  #log-lines .task {
    color: var(--cyan);
    opacity: 1;
    margin-bottom: 4px;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 0.9; transform: translateY(0); } }
</style>
</head>
<body class="idle">
  <div id="wrap">
    <div id="core">
      <div class="ring" id="ring-outer"></div>
      <div class="ring" id="ring-mid"></div>
      <div class="ring" id="ring-inner"></div>
      <div id="core-glow"></div>
    </div>
    <div id="status">Idle — say SARMAD</div>
    <div id="transcript"></div>
    <div id="log-panel">
      <div id="log-header"><span id="log-dot"></span>CLAUDE CODE ACTIVITY</div>
      <div id="log-lines"></div>
    </div>
  </div>
<script>
  const STATE_LABELS = {
    idle: "Idle — say SARMAD",
    listening: "Listening...",
    thinking: "Thinking...",
    speaking: "Speaking...",
    coding: "Coding..."
  };
  const MAX_LOG_LINES = 300;

  function setState(state) {
    document.body.className = state;
    document.getElementById("status").textContent = STATE_LABELS[state] || state;
  }

  function setTranscript(userText, replyText) {
    const el = document.getElementById("transcript");
    el.innerHTML = "";
    if (userText) {
      const you = document.createElement("div");
      you.className = "you";
      you.textContent = "You: " + userText;
      el.appendChild(you);
    }
    if (replyText) {
      const s = document.createElement("div");
      s.className = "sarmad";
      s.textContent = "SARMAD: " + replyText;
      el.appendChild(s);
    }
  }

  function appendLog(line, isTask) {
    const container = document.getElementById("log-lines");
    const el = document.createElement("div");
    if (isTask) el.className = "task";
    el.textContent = line;
    container.appendChild(el);
    while (container.children.length > MAX_LOG_LINES) {
      container.removeChild(container.firstChild);
    }
    container.scrollTop = container.scrollHeight;
  }

  function clearLog() {
    document.getElementById("log-lines").innerHTML = "";
  }

  window.setState = setState;
  window.setTranscript = setTranscript;
  window.appendLog = appendLog;
  window.clearLog = clearLog;
</script>
</body>
</html>
